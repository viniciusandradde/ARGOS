# ARGOS web (HTTP interno na porta 8080; o TLS fica num proxy à frente).
limit_req_zone $binary_remote_addr zone=sefaz:1m rate=30r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Arquivos sem hash no nome: sempre revalidar, para a versão nova valer logo após o deploy.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  # Câmera só nesta origem (leitura do QR); nada de microfone.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

  location / { try_files $uri $uri/ =404; }

  location /downloads/ {
    alias /usr/share/nginx/downloads/;
    types { application/vnd.android.package-archive apk; text/plain sha256; }
    add_header Content-Disposition attachment always;
    add_header X-Content-Type-Options nosniff always;
  }

  # SEFAZ-MS: no navegador a consulta da NFC-e não libera CORS. Repasse só deste caminho, só GET, sem cookies,
  # com a consulta assinada intacta e limite de 30 por minuto por IP.
  location = /sefaz-ms/nfce/qrcode/ {
    limit_except GET { deny all; }
    limit_req zone=sefaz burst=10 nodelay;
    include /etc/nginx/argos-resolver.conf;   # gerado ao iniciar a partir de /etc/resolv.conf
    set $sefaz https://www.dfe.ms.gov.br;
    proxy_pass $sefaz/nfce/qrcode/$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host www.dfe.ms.gov.br;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "ARGOS-web";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
  }
  location /sefaz-ms/ { return 404; }
}
