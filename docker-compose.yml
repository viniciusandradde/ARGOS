# ARGOS — instalação leve para VPS (1 vCPU / 1 GB de RAM é suficiente)
#
#   docker compose up -d --build                    # ARGOS + HTTPS (Caddy)
#   docker compose --profile whatsapp up -d         # + WhatsApp via Evolution API (exige ~1 GB a mais)
#   docker compose --profile relatorios up -d       # + Metabase (opcional, desligado por padrão)
#
# O coletor de indicadores e o envio de alertas rodam DENTRO do serviço "argos"
# (RADAR_COLETOR_EMBUTIDO=1), sem container extra.
services:
  argos:
    build: .
    env_file: .env
    environment:
      RADAR_COLETOR_EMBUTIDO: "1"
    volumes:
      - argos-data:/data
    expose:
      - "8061"
    mem_limit: 512m
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8061/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARGOS_DOMINIO: ${ARGOS_DOMINIO:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - argos
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs

  # --- WhatsApp: Evolution API (perfil "whatsapp") ---------------------------
  evolution-api:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-api:latest   # fixe uma versão (ex: v2.3.x) em produção
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}   # obrigatório ao usar o perfil whatsapp
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_SENHA:-evolution}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: argos
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      - evolution-postgres
    mem_limit: 768m
    restart: unless-stopped
    logging: *logs

  evolution-postgres:
    profiles: ["whatsapp"]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_SENHA:-evolution}
    volumes:
      - evolution-db:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    logging: *logs

  # --- Relatórios: Metabase (perfil "relatorios", desligado por padrão) -------
  metabase:
    profiles: ["relatorios"]
    image: metabase/metabase:latest   # fixe uma versão em produção
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
      - argos-data:/argos-data:ro   # SQLite: /argos-data/indicadores.db
    restart: unless-stopped
    logging: *logs

volumes:
  argos-data:
  caddy-data:
  caddy-config:
  evolution-instances:
  evolution-db:
  metabase-data:
