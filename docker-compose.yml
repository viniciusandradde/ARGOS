# ARGOS — stack simples: aplicação web + coletor + Metabase (relatórios)
#
#   docker compose up -d --build                       # sem WhatsApp
#   docker compose --profile whatsapp up -d --build    # com Evolution API (WhatsApp)
#
#   Portal/painel:  http://localhost:8061/conta  e  /painel
#   Metabase:       http://localhost:3000   (banco: SQLite em /indicadores/indicadores.db)
#   Evolution API:  http://localhost:8080   (só local; o ARGOS acessa por http://evolution-api:8080)
#
# Volumes separados de propósito: o Metabase só enxerga o banco público de
# indicadores, nunca o banco de usuários, chaves e pagamentos.
services:
  mcp-brasil:
    build: .
    ports:
      - "8061:8061"
    env_file: .env
    environment:
      RADAR_DB_PATH: /app/data/radar.db
      RADAR_INDICADORES_DB: /indicadores/indicadores.db
      RADAR_COLETOR_EMBUTIDO: "0"   # a coleta roda no serviço "coletor"
    volumes:
      - radar-data:/app/data
      - indicadores:/indicadores
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8061/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  coletor:   # coleta indicadores e envia os alertas de WhatsApp/Telegram
    build: .
    command: ["uv", "run", "python", "-m", "mcp_brasil.radar", "coletar", "--loop"]
    env_file: .env
    environment:
      RADAR_DB_PATH: /app/data/radar.db
      RADAR_INDICADORES_DB: /indicadores/indicadores.db
    volumes:
      - radar-data:/app/data
      - indicadores:/indicadores
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest   # fixe uma versão (ex: v0.5x.y) em produção
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
      - indicadores:/indicadores
    restart: unless-stopped

  # --- WhatsApp: Evolution API (perfil "whatsapp") ---------------------------
  evolution-api:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-api:latest   # fixe uma versão (ex: v2.3.x) em produção
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}   # obrigatório ao usar o perfil whatsapp
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_SENHA:-evolution}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: argos
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      - evolution-postgres
    restart: unless-stopped

  evolution-postgres:
    profiles: ["whatsapp"]
    image: postgres:15
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_SENHA:-evolution}
    volumes:
      - evolution-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  radar-data:
  indicadores:
  metabase-data:
  evolution-instances:
  evolution-db:
